services:
  registration:
    build:
      context: .
      dockerfile: deployments/registration.Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: db
      CONNECTION_STRING: ${CONNECTION_STRING}
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - credential
      - temporal
    develop:
      watch:
        # Sync Go source files so Air recompiles automatically
        - action: sync
          path: .
          target: /app
          ignore:
            - tmp/
            - vendor/
        # Rebuild image when dependencies change
        - action: rebuild
          path: ./go.mod
        # Restart on environment file updates
        - action: sync+restart
          path: ./.env
          target: /app/.env
  credential:
    build:
      context: .
      dockerfile: deployments/credential.Dockerfile
    ports:
      - "50051:50051" 
    env_file:
      - .env
    environment:
      CONNECTION_STRING: ${CONNECTION_STRING}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # Sync Go source files so Air recompiles automatically
        - action: sync
          path: .
          target: /app
          ignore:
            - tmp/
            - vendor/
        # Rebuild image when dependencies change
        - action: rebuild
          path: ./go.mod
        # Restart on environment file updates
        - action: sync+restart
          path: ./.env
          target: /app/.env

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
    - "5432:5432"

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "7233:7233"
      - "8233:8233"

volumes:
  postgres_data:
services:
  registration:
    build:
      context: .
      dockerfile: deployments/registration.Dockerfile
    ports:
      - "8080:8080"
    
  credential:
    build:
      context: .
      dockerfile: deployments/credential.Dockerfile

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
    ports:
    - "5432:5432"

volumes:
  postgres_data:

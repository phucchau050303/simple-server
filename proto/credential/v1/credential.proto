syntax = "proto3";

package credential.v1;

option go_package = "simple-webser/proto/credential/v1;credentialv1";

service CredentialService {
    rpc SignIn(SignInRequest) returns (SignInResponse); 
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

message SignInResponse {
  bool is_valid = 1;
  string user_id = 2;
  string message = 3;
}